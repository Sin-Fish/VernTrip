spring:
  application:
    name: VernFlow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vernflow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:25MB}
      max-request-size: ${MAX_REQUEST_SIZE:100MB}

server:
  port: ${SERVER_PORT:8080}
  address: 0.0.0.0
  tomcat:
    max-http-post-size: ${MAX_HTTP_POST_SIZE:10MB}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.vernflow: DEBUG

app:
  storage:
    paper-upload-dir: ${PAPER_UPLOAD_DIR:./storage/papers}
    workspace-root-dir: ${WORKSPACE_ROOT_DIR:./storage/workspace}
    media-dir: ${MEDIA_DIR:./storage/media}
  kling:
    base-url: ${KLING_BASE_URL:https://api-singapore.klingai.com}
    api-key: ${KLING_API_KEY:}
    timeout: ${KLING_TIMEOUT:60s}
    mock-delay: ${KLING_MOCK_DELAY:8s}
  ai:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    timeout: ${AI_SERVICE_TIMEOUT:180s}
  rag-service:
    base-url: ${RAG_SERVICE_BASE_URL:${app.ai.base-url}}
    timeout: ${RAG_SERVICE_TIMEOUT:${app.ai.timeout}}
  agent-service:
    base-url: ${AGENT_SERVICE_BASE_URL:${app.ai.base-url}}
    timeout: ${AGENT_SERVICE_TIMEOUT:${app.ai.timeout}}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
    session-ttl: ${ADMIN_SESSION_TTL:12h}
  user:
    session-ttl: ${USER_SESSION_TTL:12h}
    auth-required: ${USER_AUTH_REQUIRED:true}
  openclaw:
    engine: ${ASSISTANT_ENGINE:legacy}
    base-url: ${OPENCLAW_BASE_URL:http://127.0.0.1:18789}
    gateway-token: ${OPENCLAW_GATEWAY_TOKEN:}
    agent-id: ${OPENCLAW_AGENT_ID:verntrip-main}
    timeout: ${OPENCLAW_TIMEOUT:180s}
    service-token: ${VERNTRIP_OPENCLAW_SERVICE_TOKEN:}
    session-context-ttl: ${OPENCLAW_SESSION_CONTEXT_TTL:30m}
    shadow-sample-rate: ${OPENCLAW_SHADOW_SAMPLE_RATE:1.0}
    shadow-timeout: ${OPENCLAW_SHADOW_TIMEOUT:60s}
    shadow-max-output-tokens: ${OPENCLAW_SHADOW_MAX_OUTPUT_TOKENS:2400}
    shadow-max-stored-chars: ${OPENCLAW_SHADOW_MAX_STORED_CHARS:12000}
  amap:
    web-service:
      base-url: ${AMAP_WEB_SERVICE_BASE_URL:https://restapi.amap.com}
      key: ${AMAP_WEB_SERVICE_KEY:}
      timeout: ${AMAP_WEB_SERVICE_TIMEOUT:8s}
      dynamic-catalog-enabled: ${AMAP_DYNAMIC_CATALOG_ENABLED:true}
      minimum-catalog-size: ${AMAP_MINIMUM_CATALOG_SIZE:12}
      page-size: ${AMAP_POI_PAGE_SIZE:8}
  rag:
    default-profile: ${RAG_PROFILE:tfidf_topk_basic}
  rag-store:
    datasource:
      url: ${RAG_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/vernflow}}
      username: ${RAG_DB_USERNAME:${DB_USERNAME:postgres}}
      password: ${RAG_DB_PASSWORD:${DB_PASSWORD:postgres}}
      driver-class-name: ${RAG_DB_DRIVER:${DB_DRIVER:org.postgresql.Driver}}
    flyway:
      enabled: ${RAG_FLYWAY_ENABLED:true}
      locations:
        - classpath:db/rag-migration
      table: ${RAG_FLYWAY_TABLE:flyway_schema_history_rag}

