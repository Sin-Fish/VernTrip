# Keep every Spring test on its declared primary test database instead of local .env databases.
app.rag-store.datasource.url=${spring.datasource.url}
app.rag-store.datasource.username=${spring.datasource.username}
app.rag-store.datasource.password=${spring.datasource.password}
app.rag-store.datasource.driver-class-name=${spring.datasource.driver-class-name}
app.rag-store.flyway.enabled=false
