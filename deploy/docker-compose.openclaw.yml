services:
  backend:
    environment:
      ASSISTANT_ENGINE: ${ASSISTANT_ENGINE:-legacy}
      OPENCLAW_BASE_URL: http://openclaw-gateway:18789
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_AGENT_ID: ${OPENCLAW_AGENT_ID:-verntrip-main}
      OPENCLAW_TIMEOUT: ${OPENCLAW_TIMEOUT:-180s}

  openclaw-gateway:
    build:
      context: ../openclaw-runtime
      dockerfile: Dockerfile
      args:
        OPENCLAW_IMAGE: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:2026.7.1}
    image: verntrip-openclaw:2026.7.1
    container_name: verntrip-openclaw-gateway
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      openclaw-plugin-init:
        condition: service_completed_successfully
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      VERNTRIP_OPENCLAW_SERVICE_TOKEN: ${VERNTRIP_OPENCLAW_SERVICE_TOKEN:-}
      TZ: ${OPENCLAW_TZ:-Asia/Shanghai}
    volumes:
      - openclaw-state:/home/node/.openclaw
    ports:
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    init: true
    command:
      - node
      - dist/index.js
      - gateway
      - --bind
      - lan
      - --port
      - "18789"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - vernflow-network

  openclaw-plugin-init:
    image: verntrip-openclaw:2026.7.1
    container_name: verntrip-openclaw-plugin-init
    restart: "no"
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
    volumes:
      - openclaw-state:/home/node/.openclaw
    entrypoint:
      - node
      - dist/index.js
    command:
      - plugins
      - install
      - npm-pack:/opt/verntrip/packages/verntrip-plugin.tgz
      - --force
    networks:
      - vernflow-network

  openclaw-cli:
    image: verntrip-openclaw:2026.7.1
    network_mode: "service:openclaw-gateway"
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      VERNTRIP_OPENCLAW_SERVICE_TOKEN: ${VERNTRIP_OPENCLAW_SERVICE_TOKEN:-}
      BROWSER: echo
      TZ: ${OPENCLAW_TZ:-Asia/Shanghai}
    volumes:
      - openclaw-state:/home/node/.openclaw
    entrypoint:
      - node
      - dist/index.js
    depends_on:
      - openclaw-gateway
    stdin_open: true
    tty: true

volumes:
  openclaw-state:
